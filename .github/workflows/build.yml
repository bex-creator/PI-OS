name: Build Raspberry Pi 5 Kernel

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install ARM64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu make

      - name: Compile Kernel
        run: make

      - name: Upload kernel8.img
        uses: actions/upload-artifact@v4
        with:
          name: pi5-kernel
          path: kernel8.img
